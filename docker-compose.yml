services:
  postgres:
    image: postgres:16-alpine
    container_name: aurelia-dental-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia_dev_password
      POSTGRES_DB: aurelia_dental
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
